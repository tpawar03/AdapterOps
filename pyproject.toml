[project]
name = "adapterops"
version = "0.1.0"
description = "Multi-task LoRA adapter service with cost-aware routing and calibrated evaluation"
readme = "README.md"
authors = [{ name = "Tanmay Pawar" }]
requires-python = ">=3.12"

# Base: must install on macOS arm64 (dev, eval, router, judge, demo) AND on the
# rented CUDA box. Anything CUDA-only belongs in the `gpu` extra below.
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.13",
    "datasets>=2.21",
    "accelerate>=0.34",
    "huggingface-hub>=0.25",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gradio>=4.44",
    "openai>=1.50",
    "wandb>=0.18",
    "spacy>=3.7",          # NER baseline for the PII task — names/cities/streets
    "python-dotenv>=1.0",
    "kagglehub>=1.0",   # urgency dataset (PRD §9) — Kaggle, not on the HF Hub
]

[project.optional-dependencies]
# CUDA-only. Markers keep `uv lock` resolvable on macOS — these simply drop out of
# the resolution here and install on the Linux GPU box.
#   uv sync --extra gpu     (on the rented A10G)
gpu = [
    "vllm>=0.6 ; sys_platform == 'linux'",
    "bitsandbytes>=0.44 ; sys_platform == 'linux'",
]
# F25 (P1) — tracing. Separate so the base install stays lean.
tracing = ["langfuse>=2.50"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
]

[project.scripts]
adapterops = "adapterops.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
